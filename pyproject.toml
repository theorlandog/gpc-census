[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpc-census"
version = "0.1.0"
description = "Algorithmic pipeline that constructs exact extremal states for fermionic natural-occupation-number (moment) polytopes"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Jamie Orlando", email = "jamie@orlandonh.com" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "ortools==9.15.6755",
    "pulp",
    "scipy",
    "sympy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# ortools (CP-SAT) is a required runtime dependency; classify.py still falls
# back to CBC (pulp) when it is absent or unpinned, so verdicts stay reproducible.
# S3 checkpoint mirror for the long-running scripts/ campaigns (spot-resilient
# runs). Imported lazily, so disk-only checkpointing needs nothing extra.
s3 = ["boto3"]

[project.urls]
Homepage = "https://github.com/theorlandog/gpc-census"

[project.scripts]
gpc-census = "gpc_census.cli:main"

[dependency-groups]
dev = [
    { include-group = "test" },
    "boto3",
    "ruff",
]
test = ["pytest"]

[tool.hatch.build.targets.sdist]
# results/data is the single source of truth for the dataset; tests/data is a
# symlink to it, so the sdist ships results/data (the symlink target) to stay
# self-contained. The paper under results/report ships in the release
# data-output.zip, never in the sdist.
exclude = ["results/report"]
include = [
    "src",
    "tests",
    "results/data",
    "docs/bracket_3_11.json",
    "docs/bracket_3_11_settlement.json",
    "docs/complex_fixed_1rdm_observable_ranges.md",
    "docs/fixed_1rdm_observable_ranges.md",
    "docs/fixed_n3_generator_methodology.md",
    "docs/level5_ressayre_3_11.md",
    "docs/rank11_open_candidate_designs.md",
    "docs/rdm_observability_census.md",
    "docs/stage1_klyachko_spec.md",
    "docs/stage1_ressayre_3_6.md",
    "docs/stage1_ressayre_3_7.md",
    "docs/vb_carrier_hamiltonian.md",
    "scripts/bdr_fixed_n3_backend.py",
    "scripts/fixed_1rdm_observable_ranges.py",
    "scripts/fixed_n3_series.py",
    "scripts/generate_fixed_n3_candidate_system.py",
    "scripts/generate_fixed_n3_reference_rank.py",
    "scripts/level5_ressayre_3_11.py",
    "scripts/rank11_open_candidate_designs.py",
    "scripts/plethysm_inner_hull.py",
    "scripts/complex_fixed_1rdm_observable_ranges.py",
    "scripts/fixed_1rdm_observable_ranges.py",
    "scripts/verify_complex_fixed_1rdm_observable_ranges_standalone.py",
    "scripts/rdm_observability_census.py",
    "scripts/screen_fixed_n3_candidates.py",
    "scripts/stage1_generator.py",
    "scripts/vb_carrier_hamiltonian.py",
    "scripts/verify_level5_ressayre_3_11_standalone.py",
    "scripts/verify_fixed_1rdm_observable_ranges.py",
    "scripts/verify_fixed_1rdm_observable_ranges_standalone.py",
    "scripts/verify_rdm_observability_standalone.py",
    "scripts/verify_stage1_3_6_standalone.py",
    "scripts/verify_stage1_3_7.py",
    "scripts/verify_stage1_ressayre_3_7.py",
    "scripts/verify_vb_carrier_hamiltonian_standalone.py",
    "gpc-census.spec",
    "Makefile",
    "README.md",
    "LICENSE",
    ".python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpc_census"]

# Embed the precomputed dataset (single source of truth: results/data) into the
# wheel as package data, so gpc_census.dataset can serve it from an installed
# package without a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"results/data" = "gpc_census/_data"

[tool.ruff]
extend-exclude = ["scripts"]
line-length = 100
src = ["src", "tests"]
